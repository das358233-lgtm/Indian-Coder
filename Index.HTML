
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indian GST Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      padding: 30px;
    }
    .calculator {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #ddd;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      box-sizing: border-box;
    }
    button {
      background: #2458c6;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h2>Indian GST Calculator</h2>
    <label for="amount">Amount (INR)</label>
    <input id="amount" type="number"
           min="0" step="0.01"
           placeholder="Enter amount">

    <label for="rate">GST Rate</label>
    <select id="rate">
      <option value="5">5%</option>
      <option value="12">12%</option>
      <option value="18">18%</option>
      <option value="28">28%</option>
    </select>

    <button onclick="calculateGST()">
      Calculate GST
    </button>
    <p id="result" aria-live="polite"></p>
  </div>

  <script>
    function calculateGST() {
      const raw = document.getElementById("amount").value;
      const amount = Number(raw);
      const rate = Number(document.getElementById("rate").value);
      const result = document.getElementById("result");

      if (raw.trim() === "" || !Number.isFinite(amount) || amount < 0) {
        result.textContent = "Please enter a valid amount.";
        return;
      }

      const tax = amount * rate / 100;
      const total = amount + tax;
      result.textContent =
        "GST: ₹" + tax.toFixed(2) +
        " | Total: ₹" + total.toFixed(2);
    }
  </script>
</body>
</html>
